# Laser in alla dashboards som ligger i grafana/dashboards/.

apiVersion: 1

providers:
  - name: LIMNA
    orgId: 1
    folder: LIMNA
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
