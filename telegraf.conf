# Bryggan mellan MQTT och databasen.
# Prenumererar pa bojarnas matningar och skriver dem till InfluxDB.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["limna/+/measurements"]
  qos = 1
  client_id = "telegraf-limna"

  data_format = "json"
  name_override = "limna"

  # Tidsstampeln kommer fran bojen, inte fran servern. Viktigt: en matning
  # som legat i bufferten i tre dygn ska hamna pa ratt tidpunkt i grafen.
  json_time_key    = "t"
  json_time_format = "2006-01-02T15:04:05Z07:00"

  # Dessa blir taggar, alltsa nagot man kan filtrera pa i Grafana.
  tag_keys = ["boj", "namn"]

  # Allt ovrigt numeriskt blir matvarden automatiskt.

[[outputs.influxdb_v2]]
  urls  = ["http://influxdb:8086"]
  # Token star i .env, inte har. Telegraf expanderar ${...} ur sin miljo,
  # och docker-compose.yml skickar in vardet.
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
